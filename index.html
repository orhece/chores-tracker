<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'self' data:; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chores">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<title>Chores</title>
<style>
  :root { --bg:#f2f2f7; --card:#fff; --text:#000; --sub:#8e8e93; --line:#c6c6c8; --accent:#007aff; --red:#ff3b30; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --text:#fff; --sub:#8e8e93; --line:#38383a; --accent:#0a84ff; --red:#ff453a; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text); font:17px -apple-system, system-ui, sans-serif; }
  body { padding:env(safe-area-inset-top) 0 calc(60px + env(safe-area-inset-bottom)); -webkit-text-size-adjust:100%; }
  header { display:flex; align-items:flex-end; justify-content:space-between; padding:12px 16px 4px; }
  h1 { font-size:34px; margin:0; }
  .hsub { color:var(--sub); font-size:15px; padding:0 16px 8px; }
  button { font:inherit; color:var(--accent); background:none; border:0; padding:8px; cursor:pointer; }
  h2 { font-size:22px; margin:20px 16px 6px; text-transform:capitalize; }
  h3 { font-size:13px; font-weight:400; color:var(--sub); text-transform:uppercase; margin:12px 16px 6px; }
  ul { list-style:none; margin:0 16px; padding:0; background:var(--card); border-radius:10px; overflow:hidden; }
  li { display:flex; align-items:center; min-height:52px; padding:6px 0 6px 12px; }
  li + li { position:relative; }
  li + li::before { content:""; position:absolute; top:0; left:48px; right:0; border-top:0.5px solid var(--line); }
  .check { flex:none; width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); margin-right:12px; padding:0; }
  .check.on { background:var(--accent); border-color:var(--accent); box-shadow:inset 0 0 0 3px var(--card); }
  .body { flex:1; min-width:0; padding-right:12px; }
  .name { text-transform:lowercase; }
  .meta { color:var(--sub); font-size:14px; margin-top:2px; }
  .late { color:var(--red); }
  .skip { font-size:15px; flex:none; margin-right:4px; }
  .empty { color:var(--sub); text-align:center; padding:48px 16px; }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--card); border-top:0.5px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; padding:10px 0 8px; color:var(--sub); font-size:12px; position:relative; }
  nav button.on { color:var(--accent); font-weight:600; }
  .badge { display:inline-block; min-width:18px; padding:0 5px; border-radius:9px; background:var(--red); color:#fff; font-size:12px; margin-left:4px; }
  .sheet { position:fixed; inset:0; background:var(--bg); overflow:auto; padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom)); display:none; z-index:10; }
  .sheet.open { display:block; }
  .bar { display:flex; justify-content:space-between; align-items:center; padding:8px; }
  .bar b { font-size:17px; }
  label { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:46px; padding:0 12px; background:var(--card); }
  label + label { border-top:0.5px solid var(--line); }
  input { font:inherit; color:var(--text); background:none; border:0; text-align:right; flex:1; min-width:0; font-size:17px; }
  input:focus { outline:none; }
  .group { margin:16px; border-radius:10px; overflow:hidden; }
  .group button { display:block; width:100%; text-align:left; padding:12px; background:var(--card); }
  .group button + button { border-top:0.5px solid var(--line); }
  .danger { color:var(--red) !important; }
  .note { color:var(--sub); font-size:13px; margin:6px 32px; }
  #toast { position:fixed; left:16px; right:16px; bottom:calc(72px + env(safe-area-inset-bottom)); background:#333; color:#fff; border-radius:12px; padding:6px 6px 6px 14px; display:none; align-items:center; justify-content:space-between; z-index:20; }
  #toast button { color:#64d2ff; font-weight:600; }
</style>
</head>
<body>

<main id="view"></main>

<nav>
  <button data-tab="all">All</button>
  <button data-tab="today">Today<span id="b-today"></span></button>
  <button data-tab="late">Past Due<span id="b-late"></span></button>
</nav>

<div id="toast"><span id="toast-msg"></span><button id="toast-undo">Undo</button></div>

<!-- edit / add chore -->
<div class="sheet" id="edit">
  <div class="bar"><button id="e-cancel">Cancel</button><b id="e-title">Chore</b><button id="e-save"><b>Save</b></button></div>
  <div class="group">
    <label>Chore <input id="e-name" autocomplete="off" placeholder="name"></label>
    <label>Room <input id="e-room" autocomplete="off" list="rooms" placeholder="room"></label>
    <label>Every _ weeks <input id="e-every" type="number" inputmode="numeric" min="1"></label>
    <label>Minutes <input id="e-min" type="number" inputmode="numeric" min="0"></label>
    <label>Next due <input id="e-due" type="date"></label>
  </div>
  <p class="note" id="e-last"></p>
  <div class="group" id="e-delwrap"><button class="danger" id="e-del">Delete Chore</button></div>
  <datalist id="rooms"></datalist>
</div>

<!-- settings -->
<div class="sheet" id="settings">
  <div class="bar"><span></span><b>Settings</b><button id="s-done"><b>Done</b></button></div>
  <div class="group">
    <button id="s-import">Import chores / backup file…</button>
    <button id="s-export">Export backup</button>
  </div>
  <p class="note">Everything is stored only on this device. Nothing is sent anywhere. Export a backup now and then — if you delete the app from your home screen, its data goes with it.</p>
  <div class="group"><button class="danger" id="s-wipe">Delete all data on this device</button></div>
  <input type="file" id="s-file" accept=".json,application/json" hidden>
</div>

<script>
(() => {
  const KEY = 'chores.v1';
  const $ = id => document.getElementById(id);
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // ---- dates: stored as "YYYY-MM-DD", math done on whole days ----
  const pad = n => String(n).padStart(2, '0');
  const toDay = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d) / 864e5; };
  const fromDay = n => { const d = new Date(n * 864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  const pretty = s => { const d = new Date(toDay(s) * 864e5); return `${DAYS[d.getUTCDay()]}, ${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}`; };
  const weekday = s => DAYS[new Date(toDay(s) * 864e5).getUTCDay()];
  const freqLabel = n => n == 1 ? 'Weekly' : `Every ${n} weeks`;

  // first scheduled date strictly after `after` (keeps the chore on its weekday rhythm)
  const nextAfter = (c, after) => {
    const p = 7 * c.every; let d = toDay(c.due); const a = toDay(after);
    if (d <= a) d += Math.ceil((a - d + 1) / p) * p;
    return fromDay(d);
  };

  // ---- storage ----
  let state = load();
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || { chores: [] }; } catch { return { chores: [] }; } }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const uid = () => Math.random().toString(36).slice(2, 10);

  // ---- actions ----
  let undo = null, toastTimer = null;
  function complete(id) {
    const c = state.chores.find(x => x.id === id); if (!c) return;
    const t = todayStr();
    const before = { due: c.due, log: c.log.slice() };
    c.log.unshift({ done: t, due: c.due }); c.log = c.log.slice(0, 50);
    c.due = nextAfter(c, c.due > t ? c.due : t);
    save();
    toast(`Done · next ${pretty(c.due)}`, () => { c.due = before.due; c.log = before.log; save(); render(); });
  }
  function skip(id) {
    const c = state.chores.find(x => x.id === id); if (!c) return;
    const before = c.due;
    c.due = nextAfter(c, todayStr()); save(); render();
    toast(`Skipped · next ${pretty(c.due)}`, () => { c.due = before; save(); render(); });
  }
  function toast(msg, fn) {
    undo = fn; $('toast-msg').textContent = msg; $('toast').style.display = 'flex';
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').style.display = 'none'; undo = null; }, 5000);
  }
  $('toast-undo').onclick = () => { if (undo) undo(); undo = null; $('toast').style.display = 'none'; };

  // ---- rendering ----
  let tab = localStorage.getItem(KEY + '.tab') || 'today';
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const roomSort = (a, b) => (a === 'misc') - (b === 'misc') || a.localeCompare(b);
  const groupBy = (arr, f) => arr.reduce((m, x) => ((m[f(x)] ||= []).push(x), m), {});
  const n = (k, w) => `${k} ${w}${k === 1 ? '' : 's'}`;
  const mins = list => list.reduce((s, c) => s + (+c.minutes || 0), 0);

  function row(c, mode) {
    const t = todayStr();
    let meta;
    if (mode === 'all') {
      const late = c.due < t;
      meta = `${weekday(c.due)} · ${c.minutes} min · <span class="${late ? 'late' : ''}">${c.due === t ? 'due today' : (late ? 'past due ' : 'next ') + pretty(c.due)}</span>`;
    } else if (mode === 'today') {
      meta = `${freqLabel(c.every).toLowerCase()} · ${c.minutes} min`;
    } else {
      const ago = toDay(t) - toDay(c.due);
      meta = `${c.room} · <span class="late">due ${pretty(c.due)} (${ago} day${ago > 1 ? 's' : ''} ago)</span> · ${c.minutes} min`;
    }
    return `<li><button class="check" data-done="${c.id}" aria-label="Mark done"></button>
      <div class="body" data-edit="${c.id}"><div class="name">${esc(c.name)}</div><div class="meta">${meta}</div></div>
      ${mode === 'late' ? `<button class="skip" data-skip="${c.id}">Skip</button>` : ''}</li>`;
  }

  function render() {
    const t = todayStr(), cs = state.chores;
    const dueToday = cs.filter(c => c.due === t), late = cs.filter(c => c.due < t);
    $('b-today').innerHTML = dueToday.length ? `<span class="badge" style="background:var(--accent)">${dueToday.length}</span>` : '';
    $('b-late').innerHTML = late.length ? `<span class="badge">${late.length}</span>` : '';
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));

    let h = '';
    if (!cs.length) {
      h = `<header><h1>Chores</h1><button data-open="settings">Settings</button></header>
        <div class="empty">No chores yet.<br><br><button data-open="settings">Import your chores file</button><br>or<br><button data-add>Add a chore</button></div>`;
    } else if (tab === 'all') {
      h = `<header><h1>All</h1><span><button data-open="settings">Settings</button><button data-add>＋</button></span></header>
        <div class="hsub">${n(cs.length,'chore')}</div>`;
      const byRoom = groupBy(cs, c => c.room);
      for (const room of Object.keys(byRoom).sort(roomSort)) {
        h += `<h2>${esc(room)}</h2>`;
        const byFreq = groupBy(byRoom[room], c => c.every);
        for (const f of Object.keys(byFreq).sort((a, b) => a - b)) {
          const list = byFreq[f].sort((a, b) => a.due.localeCompare(b.due) || a.name.localeCompare(b.name));
          h += `<h3>${freqLabel(f)}</h3><ul>${list.map(c => row(c, 'all')).join('')}</ul>`;
        }
      }
    } else if (tab === 'today') {
      h = `<header><h1>Today</h1><button data-add>＋</button></header><div class="hsub">${pretty(t)}${dueToday.length ? ` · ${n(dueToday.length,'chore')} · ~${mins(dueToday)} min` : ''}</div>`;
      if (!dueToday.length) h += `<div class="empty">Nothing due today.${late.length ? `<br>${late.length} past due.` : ''}</div>`;
      const byRoom = groupBy(dueToday, c => c.room);
      for (const room of Object.keys(byRoom).sort(roomSort))
        h += `<h2>${esc(room)}</h2><ul>${byRoom[room].sort((a, b) => a.name.localeCompare(b.name)).map(c => row(c, 'today')).join('')}</ul>`;
    } else {
      h = `<header><h1>Past Due</h1></header><div class="hsub">${late.length ? `${n(late.length,'chore')} · ~${mins(late)} min` : ''}</div>`;
      if (!late.length) h += `<div class="empty">All caught up.</div>`;
      else h += `<ul style="margin-top:12px">${late.sort((a, b) => a.due.localeCompare(b.due)).map(c => row(c, 'late')).join('')}</ul>`;
    }
    $('view').innerHTML = h;
  }

  // ---- taps ----
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-done],[data-skip],[data-edit],[data-add],[data-open],[data-tab]');
    if (!el) return;
    if (el.dataset.done) { el.classList.add('on'); setTimeout(() => { complete(el.dataset.done); render(); }, 350); }
    else if (el.dataset.skip) skip(el.dataset.skip);
    else if (el.dataset.edit) openEdit(el.dataset.edit);
    else if ('add' in el.dataset) openEdit(null);
    else if (el.dataset.open) $(el.dataset.open).classList.add('open');
    else if (el.dataset.tab) { tab = el.dataset.tab; localStorage.setItem(KEY + '.tab', tab); render(); scrollTo(0, 0); }
  });

  // ---- edit sheet ----
  let editing = null;
  function openEdit(id) {
    editing = id;
    const c = state.chores.find(x => x.id === id) || { name: '', room: '', every: 1, minutes: 5, due: todayStr(), log: [] };
    $('e-title').textContent = id ? 'Edit Chore' : 'New Chore';
    $('e-name').value = c.name; $('e-room').value = c.room; $('e-every').value = c.every;
    $('e-min').value = c.minutes; $('e-due').value = c.due;
    $('e-last').textContent = c.log.length ? `Last done ${pretty(c.log[0].done)}` : (id ? 'Not done yet in this app.' : '');
    $('e-delwrap').style.display = id ? '' : 'none';
    $('rooms').innerHTML = [...new Set(state.chores.map(x => x.room))].map(r => `<option value="${esc(r)}">`).join('');
    $('edit').classList.add('open');
  }
  const closeEdit = () => { $('edit').classList.remove('open'); document.activeElement.blur(); };
  $('e-cancel').onclick = closeEdit;
  $('e-save').onclick = () => {
    const name = $('e-name').value.trim(), room = $('e-room').value.trim().toLowerCase();
    if (!name || !room || !$('e-due').value) return alert('Add a name, room and next due date.');
    const data = { name, room, every: Math.max(1, parseInt($('e-every').value) || 1), minutes: Math.max(0, parseInt($('e-min').value) || 0), due: $('e-due').value };
    if (editing) Object.assign(state.chores.find(x => x.id === editing), data);
    else state.chores.push({ id: uid(), log: [], ...data });
    save(); closeEdit(); render();
  };
  $('e-del').onclick = () => {
    if (!confirm('Delete this chore?')) return;
    state.chores = state.chores.filter(x => x.id !== editing); save(); closeEdit(); render();
  };

  // ---- settings: import / export / wipe ----
  $('s-done').onclick = () => $('settings').classList.remove('open');
  $('s-import').onclick = () => $('s-file').click();
  $('s-file').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const t = todayStr();
      const chores = (data.chores || []).map(c => {
        const ch = { id: c.id || uid(), name: String(c.name), room: String(c.room).toLowerCase(), every: Math.max(1, +c.every || 1), minutes: +c.minutes || 0, due: c.due || c.start, log: c.log || [] };
        // a fresh chores list (not a backup) starts at the next scheduled date from today
        if (!c.due && ch.due < t) ch.due = nextAfter({ ...ch }, fromDay(toDay(t) - 1));
        return ch;
      });
      if (!chores.length) throw 0;
      if (state.chores.length && !confirm(`Replace your current ${state.chores.length} chores with ${chores.length} from this file?`)) return;
      state = { chores }; save(); $('settings').classList.remove('open'); tab = 'today'; render();
      alert(`Imported ${chores.length} chores.`);
    } catch { alert("That file couldn't be read. Pick the chores .json file or a backup you exported."); }
  };
  $('s-export').onclick = async () => {
    const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
    const file = new File([blob], `chores-backup-${todayStr()}.json`, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); } catch {} return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  };
  $('s-wipe').onclick = () => {
    if (!confirm('Delete all chores and history from this device?')) return;
    localStorage.removeItem(KEY); state = { chores: [] }; $('settings').classList.remove('open'); render();
  };

  // re-check the date when the app comes back to the front (e.g. the next morning)
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  render();
})();
</script>
</body>
</html>
