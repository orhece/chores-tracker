<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'self' data:; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chores">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<title>Chores</title>
<style>
  :root { --bg:#f2f2f7; --card:#fff; --text:#000; --sub:#8e8e93; --line:#c6c6c8; --accent:#C6FF8C; --on-accent:#000; --link:#2f7d00; --red:#ff3b30; --top:calc(env(safe-area-inset-top) + 20px); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#1c1c1e; --text:#fff; --sub:#8e8e93; --line:#38383a; --accent:#C6FF8C; --on-accent:#000; --link:#C6FF8C; --red:#ff453a; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text); font:17px -apple-system, system-ui, sans-serif; }
  body { padding:var(--top) 0 calc(100px + env(safe-area-inset-bottom)); -webkit-text-size-adjust:100%; }
  body.modal { overflow:hidden; }
  .topbar { display:flex; justify-content:space-between; align-items:center; min-height:44px; padding:0 16px; margin-bottom:10px; }
  header { padding:0 16px 4px; }
  h1 { font-size:34px; margin:0; display:inline-block; }
  h1.tap { cursor:pointer; -webkit-user-select:none; user-select:none; }
  .hsub { color:var(--sub); font-size:15px; padding:0 16px 8px; }
  button { font:inherit; color:var(--text); background:none; border:0; padding:8px; cursor:pointer; }
  .pill { background:var(--accent); color:var(--on-accent); border-radius:999px; padding:7px 14px; font-size:15px; font-weight:600; margin-left:8px; }
  .pill.sm { padding:5px 12px; font-size:14px; }
  .topbar .pill:first-child { margin-left:0; }
  h2 { font-size:22px; margin:20px 16px 6px; text-transform:capitalize; }
  h2 .count { color:var(--sub); font-weight:400; }
  h2.toggle { display:flex; align-items:center; cursor:pointer; -webkit-user-select:none; user-select:none; }
  h2 .pill { margin-left:auto; text-transform:none; }
  h3 { font-size:13px; font-weight:400; color:var(--sub); text-transform:uppercase; margin:12px 16px 6px; }
  ul { list-style:none; margin:0 16px; padding:0; }
  li { display:flex; align-items:center; min-height:52px; padding:6px 12px; background:var(--card); border-radius:10px; margin-bottom:8px; }
  li.ph { color:var(--sub); font-size:15px; justify-content:center; }
  .check { flex:none; width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); margin-right:12px; padding:0; }
  .check.on { background:var(--accent); border-color:#7fbf3f; box-shadow:inset 0 0 0 3px var(--card); }
  .body { flex:1; min-width:0; padding-right:8px; cursor:pointer; }
  .name { text-transform:lowercase; }
  .meta { color:var(--sub); font-size:14px; margin-top:2px; }
  .wd { flex:none; width:48px; color:var(--sub); font-size:15px; }
  .mn { flex:none; width:52px; color:var(--sub); font-size:15px; text-align:right; }
  .late { color:var(--red); }
  .empty { color:var(--sub); text-align:center; padding:48px 16px; }
  .section { font-size:28px; margin:32px 16px 0; }
  nav { position:fixed; left:20px; right:20px; bottom:calc(env(safe-area-inset-bottom) + 10px); display:flex; padding:5px; border-radius:999px; z-index:5;
        background:rgba(255,255,255,.72); -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
        border:0.5px solid rgba(0,0,0,.08); box-shadow:0 6px 24px rgba(0,0,0,.12); }
  @media (prefers-color-scheme: dark) { nav { background:rgba(40,40,42,.72); border-color:rgba(255,255,255,.1); } }
  nav button { flex:1; min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border-radius:999px; padding:4px 0; color:var(--text); font-size:11px; font-weight:500; position:relative; }
  nav button svg { width:24px; height:24px; }
  nav button.on { background:var(--accent); color:var(--on-accent); font-weight:600; }
  .badge { position:absolute; top:2px; left:calc(50% + 8px); min-width:18px; padding:0 5px; border-radius:9px; background:var(--red); color:#fff; font-size:11px; line-height:18px; font-weight:600; }
  .badge.today { background:var(--text); color:var(--bg); }
  .sheet { position:fixed; inset:0; background:var(--bg); overflow-y:auto; overscroll-behavior:contain; padding:var(--top) 0 calc(24px + env(safe-area-inset-bottom)); display:none; z-index:10; }
  .sheet.open { display:block; }
  .bar { display:flex; justify-content:space-between; align-items:center; padding:0 16px 8px; position:relative; min-height:44px; }
  .bar > b { font-size:17px; position:absolute; left:50%; transform:translateX(-50%); }
  .bar .pill { margin:0; }
  label { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:46px; padding:0 12px; background:var(--card); }
  label + label { border-top:0.5px solid var(--line); }
  input { font:inherit; color:var(--text); background:none; border:0; text-align:right; flex:1; min-width:0; font-size:17px; }
  input[type=date] { display:flex; justify-content:flex-end; -webkit-appearance:none; appearance:none; min-height:30px; }
  input::-webkit-date-and-time-value { text-align:right; }
  label select { font:inherit; font-size:17px; color:var(--sub); background:none; border:0; text-align:right; -webkit-appearance:none; appearance:none; }
  #e-room { text-transform:capitalize; }
  input:focus, select:focus { outline:none; }
  .group { margin:16px; border-radius:10px; overflow:hidden; }
  .group button { display:block; width:100%; text-align:left; padding:12px; background:var(--card); }
  .group button + button { border-top:0.5px solid var(--line); }
  #clear-list button { text-transform:capitalize; }
  .empty .pill { margin:0; }
  .danger { color:var(--red) !important; }
  .note { color:var(--sub); font-size:13px; margin:6px 32px; }
  #toast { position:fixed; left:16px; right:16px; bottom:calc(84px + env(safe-area-inset-bottom)); background:#333; color:#fff; border-radius:12px; padding:6px 6px 6px 14px; display:none; align-items:center; justify-content:space-between; z-index:20; min-height:44px; }
  #toast button { color:var(--accent); font-weight:600; }
</style>
</head>
<body>

<main id="view"></main>

<nav>
  <button data-tab="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg>All</button>
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg>Today<span id="b-today"></span></button>
  <button data-tab="late"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5.5l3.5 2"/></svg>Past Due<span id="b-late"></span></button>
</nav>

<div id="toast"><span id="toast-msg"></span><button id="toast-undo">Undo</button></div>

<!-- edit / add chore -->
<div class="sheet" id="edit">
  <div class="bar"><button class="pill" id="e-cancel">Cancel</button><b id="e-title">Chore</b><button class="pill" id="e-save">Save</button></div>
  <div class="group">
    <label>Chore <input id="e-name" autocomplete="off" placeholder="name"></label>
    <label>Room <select id="e-room"></select></label>
    <label>Week frequency <input id="e-every" type="number" inputmode="numeric" min="1"></label>
    <label>Time <select id="e-min"><option value="3">3 min</option><option value="5">5 min</option><option value="10">10 min</option></select></label>
    <label>Next due <input id="e-due" type="date"></label>
  </div>
  <p class="note" id="e-last"></p>
  <div class="group" id="e-delwrap"><button class="danger" id="e-del">Delete Chore</button></div>
</div>

<!-- rename / delete room -->
<div class="sheet" id="roomsheet">
  <div class="bar"><button class="pill" id="r-cancel">Cancel</button><b>Room</b><button class="pill" id="r-save">Save</button></div>
  <div class="group"><label>Name <input id="r-name" autocomplete="off"></label></div>
  <div class="group"><button class="danger" id="r-del">Delete Room</button></div>
</div>

<!-- clear past due by room -->
<div class="sheet" id="clearsheet">
  <div class="bar"><button class="pill" id="c-cancel">Cancel</button><b>Clear Room</b><span></span></div>
  <div class="group" id="clear-list"></div>
</div>

<!-- settings -->
<div class="sheet" id="settings">
  <div class="bar"><span></span><b>Settings</b><button class="pill" id="s-done">Done</button></div>
  <div class="group">
    <button id="s-import">Import chores / backup file…</button>
    <button id="s-export">Export backup</button>
  </div>
  <div class="group"><button class="danger" id="s-wipe">Delete all data on this device</button></div>
  <input type="file" id="s-file" accept=".json,application/json" hidden>
</div>

<script>
(() => {
  const KEY = 'chores.v1';
  const $ = id => document.getElementById(id);
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const IMPORT_START_WEEKDAY = 3;     // TESTING: a fresh chores file is scheduled from the most recent Wednesday (0 = Sun … 6 = Sat)

  // ---- dates: stored as "YYYY-MM-DD", math done on whole days ----
  const pad = n => String(n).padStart(2, '0');
  const toDay = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d) / 864e5; };
  const fromDay = n => { const d = new Date(n * 864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
  const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  const dow = s => new Date(toDay(s) * 864e5).getUTCDay();
  const pretty = s => { const d = new Date(toDay(s) * 864e5); return `${DAYS[d.getUTCDay()]}, ${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}`; };
  const weekday = s => DAYS[dow(s)];
  const addDays = (s, n) => fromDay(toDay(s) + n);
  const freqLabel = n => n == 1 ? 'Weekly' : `Every ${n} weeks`;
  const snapMin = m => (m = +m || 5) <= 3 ? 3 : m <= 7 ? 5 : 10;
  const cleanRoom = r => String(r || '').trim().toLowerCase();

  // first scheduled date strictly after `after` (keeps the chore on its weekday rhythm; missed dates are dropped)
  const nextAfter = (c, after) => {
    const p = 7 * c.every; let d = toDay(c.due); const a = toDay(after);
    if (d <= a) d += Math.ceil((a - d + 1) / p) * p;
    return fromDay(d);
  };

  // ---- storage: { rooms: [...], chores: [...] } ----
  let state = load();
  function tidy(s) {
    s.chores.forEach((c, i) => { c.minutes = snapMin(c.minutes); c.room = cleanRoom(c.room); if (c.order == null) c.order = i; });
    s.rooms = [...new Set([...(s.rooms || []).map(cleanRoom), ...s.chores.map(c => c.room)])].filter(Boolean).sort();
    return s;
  }
  function load() {
    let s; try { s = JSON.parse(localStorage.getItem(KEY)); } catch {}
    return tidy(s && Array.isArray(s.chores) ? s : { rooms: [], chores: [] });
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const uid = () => Math.random().toString(36).slice(2, 10);
  const find = id => state.chores.find(x => x.id === id);

  let collapsed = new Set(JSON.parse(localStorage.getItem(KEY + '.collapsed') || '[]'));
  const saveCollapsed = () => localStorage.setItem(KEY + '.collapsed', JSON.stringify([...collapsed]));

  // ---- actions ----
  let undo = null, toastTimer = null;
  function complete(id) {
    const c = find(id); if (!c) return;
    const t = todayStr();
    const before = { due: c.due, log: c.log.slice() };
    c.log.unshift({ done: t, due: c.due }); c.log = c.log.slice(0, 50);
    c.due = nextAfter(c, c.due > t ? c.due : t);
    save();
    toast(`Done · next ${pretty(c.due)}`, () => { c.due = before.due; c.log = before.log; save(); render(); });
  }
  // skip / clear: move past-due chores to their next date without logging them as done
  function clearLate(filter, label) {
    const t = todayStr();
    const list = state.chores.filter(c => c.due < t && filter(c));
    if (!list.length) return;
    const before = list.map(c => [c, c.due]);
    list.forEach(c => c.due = nextAfter(c, t));
    save(); render();
    toast(label || `Cleared ${list.length === 1 ? '1 chore' : list.length + ' chores'}`, () => { before.forEach(([c, d]) => c.due = d); save(); render(); });
  }
  function completeToday() {
    const t = todayStr(), list = state.chores.filter(c => c.due === t);
    if (!list.length) return;
    const before = list.map(c => [c, c.due, c.log.slice()]);
    list.forEach(c => { c.log.unshift({ done: t, due: c.due }); c.log = c.log.slice(0, 50); c.due = nextAfter(c, t); });
    save(); render();
    toast(`Completed ${list.length === 1 ? '1 chore' : list.length + ' chores'}`, () => { before.forEach(([c, d, l]) => { c.due = d; c.log = l; }); save(); render(); });
  }
  // a chore that laps (misses a date and its next date arrives) moves to its latest date and the missed one is dropped
  function rollForward() {
    const t = toDay(todayStr()); let changed = false;
    for (const c of state.chores) {
      const p = 7 * c.every, d = toDay(c.due);
      if (d < t && t - d >= p) { c.due = fromDay(d + Math.floor((t - d) / p) * p); changed = true; }
    }
    if (changed) save();
  }
  function toggleAll() {
    if (state.rooms.every(r => collapsed.has(r))) collapsed.clear(); else state.rooms.forEach(r => collapsed.add(r));
    saveCollapsed(); render();
  }
  function addRoom() {
    const r = cleanRoom(prompt('New room'));
    if (!r) return;
    if (state.rooms.includes(r)) return alert('That room already exists.');
    state.rooms.push(r); state.rooms.sort(); collapsed.delete(r); saveCollapsed(); save(); render();
  }
  function toast(msg, fn) {
    undo = fn; $('toast-msg').textContent = msg; $('toast').style.display = 'flex';
    $('toast-undo').style.display = fn ? '' : 'none';
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').style.display = 'none'; undo = null; }, 5000);
  }
  $('toast-undo').onclick = () => { if (undo) undo(); undo = null; $('toast').style.display = 'none'; };

  // ---- sheets (lock the page behind them so only one thing scrolls) ----
  const openSheet = id => { $(id).classList.add('open'); $(id).scrollTop = 0; document.body.classList.add('modal'); };
  const closeSheet = id => { $(id).classList.remove('open'); document.body.classList.remove('modal'); if (document.activeElement) document.activeElement.blur(); };

  // ---- rendering ----
  let tab = localStorage.getItem(KEY + '.tab') || 'today';
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const groupBy = (arr, f) => arr.reduce((m, x) => ((m[f(x)] ||= []).push(x), m), {});
  const mins = list => list.reduce((s, c) => s + (+c.minutes || 0), 0);
  const n = (k, w) => `${k} ${w}${k === 1 ? '' : 's'}`;
  const byName = (a, b) => a.room.localeCompare(b.room) || a.name.localeCompare(b.name);

  // All tab row: name · weekday · minutes
  const listRow = c => `<li>
      <div class="body" data-edit="${c.id}"><div class="name">${esc(c.name)}</div></div>
      <span class="wd">${weekday(c.due)}</span><span class="mn">${c.minutes} min</span></li>`;

  // Today / Upcoming / Past Due rows: completable
  const doRow = (c, meta, extra = '') => `<li><button class="check" data-done="${c.id}" aria-label="Mark done"></button>
      <div class="body" data-edit="${c.id}"><div class="name">${esc(c.name)}</div><div class="meta">${meta}</div></div>${extra}</li>`;

  function render() {
    rollForward();
    const t = todayStr(), cs = state.chores;
    const dueToday = cs.filter(c => c.due === t), late = cs.filter(c => c.due < t);
    $('b-today').innerHTML = dueToday.length ? `<span class="badge today">${dueToday.length}</span>` : '';
    $('b-late').innerHTML = late.length ? `<span class="badge">${late.length}</span>` : '';
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));

    let h = '';
    if (tab === 'all') {
      h = `<div class="topbar"><button class="pill" data-open="settings">Settings</button>
          <span><button class="pill" data-add-room>Room +</button><button class="pill" data-add>Chores +</button></span></div>
        <header><h1 class="tap" data-toggle-all>All</h1></header><div class="hsub">${n(cs.length, 'chore')}</div>`;
      if (!state.rooms.length) h += `<div class="empty">No chores yet.<br><br><button class="pill" data-open="settings">Import your chores file</button></div>`;
      const byRoom = groupBy(cs, c => c.room);
      for (const room of state.rooms) {
        const list = byRoom[room] || [], closed = collapsed.has(room);
        h += `<h2 class="toggle${closed ? ' closed' : ''}" data-toggle="${esc(room)}"><span>${esc(room)} <span class="count">(${list.length})</span></span><button class="pill sm" data-room-edit="${esc(room)}">Edit</button></h2>`;
        if (closed) continue;
        const byFreq = groupBy(list, c => c.every);
        for (const f of Object.keys(byFreq).map(Number).sort((a, b) => a - b)) {
          const items = byFreq[f].sort((a, b) => a.order - b.order || a.name.localeCompare(b.name));
          h += `<h3>${freqLabel(f)}</h3><ul>${items.map(listRow).join('')}</ul>`;
        }
      }
    } else if (tab === 'today') {
      h = `<div class="topbar"><span></span>${dueToday.length ? '<button class="pill" data-complete-all>Complete All</button>' : ''}</div><header><h1>Today</h1></header>
        <div class="hsub">${pretty(t)}${dueToday.length ? ` · ${n(dueToday.length, 'chore')} · ~${mins(dueToday)} min` : ''}</div>`;
      if (!dueToday.length) h += `<div class="empty">Nothing due today.${late.length ? `<br>${late.length} past due.` : ''}</div>`;
      const byRoom = groupBy(dueToday, c => c.room);
      for (const room of Object.keys(byRoom).sort())
        h += `<h2>${esc(room)}</h2><ul>${byRoom[room].sort(byName).map(c => doRow(c, `${freqLabel(c.every).toLowerCase()} · ${c.minutes} min`)).join('')}</ul>`;

      h += `<div class="section"><b>Upcoming</b></div>`;
      for (const d of [addDays(t, 1), addDays(t, 2)]) {
        const list = cs.filter(c => c.due === d).sort(byName);
        h += `<h3>${d === addDays(t, 1) ? 'Tomorrow · ' : ''}${pretty(d)}${list.length ? ` · ${n(list.length, 'chore')} · ~${mins(list)} min` : ''}</h3>`;
        h += `<ul>${list.length ? list.map(c => doRow(c, `${c.room} · ${c.minutes} min`)).join('') : '<li class="ph">Nothing scheduled</li>'}</ul>`;
      }
    } else {
      h = `<div class="topbar"><span></span>${late.length ? `<span><button class="pill" data-clear-room>Clear Room</button><button class="pill" data-clear-all>Clear All</button></span>` : ''}</div>
        <header><h1>Past Due</h1></header><div class="hsub">${late.length ? `${n(late.length, 'chore')} · ~${mins(late)} min` : ''}</div>`;
      if (!late.length) h += `<div class="empty">All caught up.</div>`;
      else h += `<ul style="margin-top:12px">${late.sort((a, b) => a.due.localeCompare(b.due) || byName(a, b)).map(c => {
        const ago = toDay(t) - toDay(c.due);
        return doRow(c, `${c.room} · <span class="late">${n(ago, 'day')} ago</span> · ${c.minutes} min`,
          `<button class="pill sm" data-skip="${c.id}">Skip</button>`);
      }).join('')}</ul>`;
    }
    $('view').innerHTML = h;
  }

  // ---- taps ----
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-done],[data-skip],[data-edit],[data-add],[data-add-room],[data-room-edit],[data-toggle],[data-toggle-all],[data-clear-all],[data-complete-all],[data-clear-room],[data-clear-pick],[data-open],[data-tab]');
    if (!el) return;
    const d = el.dataset;
    if (d.done) { el.classList.add('on'); setTimeout(() => { complete(d.done); render(); }, 350); }
    else if (d.skip) { const c = find(d.skip); clearLate(x => x === c, `Skipped · next ${pretty(nextAfter(c, todayStr()))}`); }
    else if (d.edit) openEdit(d.edit);
    else if ('add' in d) openEdit(null);
    else if ('addRoom' in d) addRoom();
    else if (d.roomEdit) openRoom(d.roomEdit);
    else if (d.toggle) { collapsed.has(d.toggle) ? collapsed.delete(d.toggle) : collapsed.add(d.toggle); saveCollapsed(); render(); }
    else if ('toggleAll' in d) toggleAll();
    else if ('clearAll' in d) clearLate(() => true);
    else if ('completeAll' in d) completeToday();
    else if ('clearRoom' in d) openClearRoom();
    else if (d.clearPick) { closeSheet('clearsheet'); clearLate(c => c.room === d.clearPick); }
    else if (d.open) openSheet(d.open);
    else if (d.tab) { tab = d.tab; localStorage.setItem(KEY + '.tab', tab); render(); scrollTo(0, 0); }
  });

  // ---- clear room menu (rooms that have past-due chores) ----
  function openClearRoom() {
    const t = todayStr(), counts = groupBy(state.chores.filter(c => c.due < t), c => c.room);
    $('clear-list').innerHTML = Object.keys(counts).sort().map(r => `<button data-clear-pick="${esc(r)}">${esc(r)} (${counts[r].length})</button>`).join('');
    openSheet('clearsheet');
  }
  $('c-cancel').onclick = () => closeSheet('clearsheet');

  // ---- rename / delete room ----
  let editingRoom = null;
  function openRoom(r) { editingRoom = r; $('r-name').value = r; openSheet('roomsheet'); }
  $('r-cancel').onclick = () => closeSheet('roomsheet');
  $('r-save').onclick = () => {
    const name = cleanRoom($('r-name').value), old = editingRoom;
    if (!name) return alert('Add a room name.');
    if (name !== old) {
      if (state.rooms.includes(name)) return alert('That room already exists.');
      state.rooms = state.rooms.map(r => r === old ? name : r).sort();
      state.chores.forEach(c => { if (c.room === old) c.room = name; });
      if (collapsed.delete(old)) collapsed.add(name);
      saveCollapsed(); save();
    }
    closeSheet('roomsheet'); render();
  };
  $('r-del').onclick = () => {
    const r = editingRoom, k = state.chores.filter(c => c.room === r).length;
    if (!confirm(k ? `Delete ${r} and its ${n(k, 'chore')}?` : `Delete ${r}?`)) return;
    state.rooms = state.rooms.filter(x => x !== r);
    state.chores = state.chores.filter(c => c.room !== r);
    collapsed.delete(r); saveCollapsed(); save(); closeSheet('roomsheet'); render();
  };

  // ---- edit sheet ----
  let editing = null;
  function openEdit(id) {
    if (!id && !state.rooms.length) return alert('Add a room first.');
    editing = id;
    const c = find(id) || { name: '', room: state.rooms[0], every: 1, minutes: 5, due: todayStr(), log: [] };
    $('e-title').textContent = id ? 'Edit Chore' : 'New Chore';
    $('e-room').innerHTML = state.rooms.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('');
    $('e-name').value = c.name; $('e-room').value = c.room; $('e-every').value = c.every;
    $('e-min').value = String(c.minutes); $('e-due').value = c.due;
    $('e-last').textContent = c.log.length ? `Last done ${pretty(c.log[0].done)}` : '';
    $('e-delwrap').style.display = id ? '' : 'none';
    openSheet('edit');
  }
  $('e-cancel').onclick = () => closeSheet('edit');
  $('e-save').onclick = () => {
    const name = $('e-name').value.trim();
    if (!name || !$('e-due').value) return alert('Add a name and next due date.');
    const data = { name, room: $('e-room').value, every: Math.max(1, parseInt($('e-every').value) || 1), minutes: +$('e-min').value, due: $('e-due').value };
    if (editing) Object.assign(find(editing), data);
    else state.chores.push({ id: uid(), log: [], order: 1e6, ...data });
    save(); closeSheet('edit'); render();
  };
  $('e-del').onclick = () => {
    if (!confirm('Delete this chore?')) return;
    state.chores = state.chores.filter(x => x.id !== editing); save(); closeSheet('edit'); render();
  };

  // ---- settings: import / export / wipe ----
  $('s-done').onclick = () => closeSheet('settings');
  $('s-import').onclick = () => $('s-file').click();
  $('s-file').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const t = todayStr();
      const from = addDays(t, -((dow(t) - IMPORT_START_WEEKDAY + 7) % 7));   // most recent Wednesday (or today if Wed)
      const chores = (data.chores || []).map((c, i) => {
        const ch = { id: c.id || uid(), name: String(c.name), room: cleanRoom(c.room), every: Math.max(1, +c.every || 1),
          minutes: snapMin(c.minutes), due: c.due || c.start, log: c.log || [], order: c.order ?? i };
        // a fresh chores list (not a backup) is scheduled from `from` onward
        if (!c.due && ch.due < from) ch.due = nextAfter({ ...ch }, addDays(from, -1));
        return ch;
      });
      if (!chores.length && !(data.rooms || []).length) throw 0;
      if (state.chores.length && !confirm(`Replace your current ${state.chores.length} chores with ${chores.length} from this file?`)) return;
      state = tidy({ rooms: data.rooms || [], chores }); save(); closeSheet('settings'); tab = 'today'; render();
      alert(`Imported ${chores.length} chores.`);
    } catch { alert("That file couldn't be read. Pick the chores .json file or a backup you exported."); }
  };
  $('s-export').onclick = async () => {
    const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
    const file = new File([blob], `chores-backup-${todayStr()}.json`, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); } catch {} return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  };
  $('s-wipe').onclick = () => {
    if (!confirm('Delete all chores and history from this device?')) return;
    localStorage.removeItem(KEY); state = { rooms: [], chores: [] }; closeSheet('settings'); render();
  };

  // re-check the date when the app comes back to the front (e.g. the next morning)
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
  render();
})();
</script>
</body>
</html>
